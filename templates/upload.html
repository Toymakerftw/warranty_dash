{% extends "base.html" %}

{% block title %}Upload Assets - WarrantyTrack{% endblock %}

{% block content %}
<div class="max-w-3xl mx-auto bg-white rounded-lg shadow overflow-hidden">
    <div class="px-6 py-4 border-b">
        <h2 class="text-xl font-semibold text-gray-800">Bulk Upload Assets</h2>
    </div>
    
    <div class="p-6">
        <form method="POST" action="{{ url_for('assets.upload_csv') }}" enctype="multipart/form-data">
            <div id="drop-area" class="border-2 border-dashed border-gray-300 rounded-lg p-8 text-center mb-6">
                <i class="fas fa-file-upload text-4xl text-primary mb-3"></i>
                <h3 class="text-lg font-medium text-gray-700 mb-1">Drag and drop your file here</h3>
                <p class="text-sm text-gray-500 mb-4">or</p>
                <label class="cursor-pointer bg-primary text-white px-4 py-2 rounded-md hover:bg-blue-600">
                    Browse Files
                    <input type="file" name="csv_file" id="csv_file" class="hidden" accept=".csv">
                </label>
                <p class="text-xs text-gray-500 mt-3">Supported formats: CSV (Max file size: 5MB)</p>
            </div>
            
            <div id="file-info" class="hidden mb-4 p-4 bg-gray-50 rounded-lg">
                <div class="flex justify-between items-center">
                    <div>
                        <span id="file-name" class="font-medium"></span>
                        <span id="file-size" class="text-sm text-gray-500 ml-2"></span>
                    </div>
                    <button type="button" id="remove-file" class="text-gray-400 hover:text-gray-600">
                        <i class="fas fa-times"></i>
                    </button>
                </div>
            </div>
            
            <div class="mb-6">
                <h3 class="text-md font-medium text-gray-700 mb-3">Upload Options</h3>
                <div class="space-y-3">
                    <label class="flex items-center">
                        <input type="radio" name="uploadMode" class="form-radio text-primary" checked>
                        <span class="ml-2">Add new assets only</span>
                    </label>
                    <label class="flex items-center">
                        <input type="radio" name="uploadMode" class="form-radio text-primary">
                        <span class="ml-2">Update existing assets</span>
                    </label>
                    <label class="flex items-center">
                        <input type="radio" name="uploadMode" class="form-radio text-primary">
                        <span class="ml-2">Full sync (replace all data)</span>
                    </label>
                </div>
            </div>
            
            <div class="flex justify-between items-center">
                <a href="#" class="text-primary hover:underline flex items-center">
                    <i class="fas fa-download mr-2"></i> Download CSV Template
                </a>
                <button type="submit" id="submit-btn" class="px-4 py-2 bg-primary text-white rounded-md hover:bg-blue-600 disabled:opacity-50" disabled>
                    Start Upload
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    document.addEventListener('DOMContentLoaded', function() {
        const fileInput = document.getElementById('csv_file');
        const dropArea = document.getElementById('drop-area');
        const fileInfo = document.getElementById('file-info');
        const fileName = document.getElementById('file-name');
        const fileSize = document.getElementById('file-size');
        const submitBtn = document.getElementById('submit-btn');
        const removeFile = document.getElementById('remove-file');
        
        // Handle file selection
        fileInput.addEventListener('change', function(e) {
            if (this.files.length > 0) {
                const file = this.files[0];
                displayFileInfo(file);
            }
        });
        
        // Handle drag and drop
        ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
            dropArea.addEventListener(eventName, preventDefaults, false);
        });
        
        function preventDefaults(e) {
            e.preventDefault();
            e.stopPropagation();
        }
        
        ['dragenter', 'dragover'].forEach(eventName => {
            dropArea.addEventListener(eventName, highlight, false);
        });
        
        ['dragleave', 'drop'].forEach(eventName => {
            dropArea.addEventListener(eventName, unhighlight, false);
        });
        
        function highlight() {
            dropArea.classList.add('border-primary', 'bg-blue-50');
        }
        
        function unhighlight() {
            dropArea.classList.remove('border-primary', 'bg-blue-50');
        }
        
        dropArea.addEventListener('drop', handleDrop, false);
        
        function handleDrop(e) {
            const dt = e.dataTransfer;
            const files = dt.files;
            
            if (files.length > 0) {
                fileInput.files = files;
                displayFileInfo(files[0]);
            }
        }
        
        function displayFileInfo(file) {
            if (file && file.name.endsWith('.csv')) {
                fileName.textContent = file.name;
                fileSize.textContent = formatFileSize(file.size);
                fileInfo.classList.remove('hidden');
                submitBtn.disabled = false;
            } else {
                alert('Please select a valid CSV file');
                resetFileInput();
            }
        }
        
        function formatFileSize(bytes) {
            if (bytes === 0) return '0 Bytes';
            const k = 1024;
            const sizes = ['Bytes', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
        }
        
        removeFile.addEventListener('click', function() {
            resetFileInput();
        });
        
        function resetFileInput() {
            fileInput.value = '';
            fileInfo.classList.add('hidden');
            submitBtn.disabled = true;
        }
    });
</script>
{% endblock %}
