{% extends "base.html" %}

{% block title %}Edit Asset - WarrantyTrack{% endblock %}

{% block content %}
<div class="max-w-4xl mx-auto bg-white rounded-lg shadow overflow-hidden">
    <div class="px-6 py-4 border-b">
        <h2 class="text-xl font-semibold text-gray-800">Edit Asset: {{ asset.asset_tag }}</h2>
    </div>
    
    <form method="POST" class="p-6">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Asset Tag</label>
                <input type="text" name="asset_tag" value="{{ asset.asset_tag }}" class="w-full px-3 py-2 border rounded-md focus:outline-none focus:ring-2 focus:ring-primary" required>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Manufacturer</label>
                <select name="manufacturer" class="w-full px-3 py-2 border rounded-md focus:outline-none focus:ring-2 focus:ring-primary" required>
                    <option value="Dell" {% if asset.manufacturer == 'Dell' %}selected{% endif %}>Dell</option>
                    <option value="Lenovo" {% if asset.manufacturer == 'Lenovo' %}selected{% endif %}>Lenovo</option>
                    <option value="ASUS" {% if asset.manufacturer == 'ASUS' %}selected{% endif %}>ASUS</option>
                    <option value="HP" {% if asset.manufacturer == 'HP' %}selected{% endif %}>HP</option>
                    <option value="Apple" {% if asset.manufacturer == 'Apple' %}selected{% endif %}>Apple</option>
                </select>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Model</label>
                <input type="text" name="model" value="{{ asset.model or '' }}" class="w-full px-3 py-2 border rounded-md focus:outline-none focus:ring-2 focus:ring-primary">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Serial Number</label>
                <input type="text" name="service_tag" value="{{ asset.service_tag }}" class="w-full px-3 py-2 border rounded-md focus:outline-none focus:ring-2 focus:ring-primary" required>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Purchase Date</label>
                <input type="date" name="purchase_date" value="{{ asset.purchase_date or '' }}" class="w-full px-3 py-2 border rounded-md focus:outline-none focus:ring-2 focus:ring-primary">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Warranty Expiration</label>
                <input type="date" name="warranty_end_date" value="{{ asset.warranty_end_date }}" class="w-full px-3 py-2 border rounded-md focus:outline-none focus:ring-2 focus:ring-primary" required>
            </div>
            <div class="md:col-span-2">
                <label class="block text-sm font-medium text-gray-700 mb-1">Warranty Notes</label>
                <textarea name="notes" class="w-full px-3 py-2 border rounded-md focus:outline-none focus:ring-2 focus:ring-primary" rows="3">{{ asset.notes or '' }}</textarea>
            </div>
        </div>
        
        <div class="mt-8 flex justify-end space-x-3">
            <a href="{{ url_for('main.dashboard') }}" class="px-4 py-2 border rounded-md text-gray-700 hover:bg-gray-100">
                Cancel
            </a>
            <button type="submit" class="px-4 py-2 bg-primary text-white rounded-md hover:bg-blue-600">
                Save Changes
            </button>
        </div>
    </form>
</div>
{% endblock %}
